<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDS Console</title>
  <link rel="stylesheet" href="app.css">
  <!-- Sets window.SDS_API (address of the SDS REST API), served by the Sds.Web host. -->
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="nav-toggle" id="navToggle" aria-label="Show menu" hidden>&#9776;</button>
    <div class="brand">SDS Console</div>
    <div class="api-status" id="apiStatus"></div>
    <!-- Signed in account; shown once sign in succeeds. -->
    <div class="account" id="account" hidden>
      <span id="accountName"></span>
      <button class="small" id="signOut" type="button">Sign out</button>
    </div>
  </header>

  <!-- Sign-in screen: the console always starts here (app.js). -->
  <main class="signin" id="signin"></main>

  <!-- The console itself, hidden until an authorized account is signed in. -->
  <div class="layout" id="layout" hidden>
    <!-- Navigation: one entry per view; app.js fills it from its view registry. -->
    <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>

    <!-- The active view renders here. -->
    <main class="content" id="content"></main>
  </div>

  <!-- Running background jobs (add, export, import...) with live progress. -->
  <aside class="job-tray" id="jobTray" aria-live="polite"></aside>

  <!-- Notifications. -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Dialog used for every form. -->
  <dialog id="dialog" class="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
